<!doctype html>
<html lang="en" data-color-mode="dark" data-dark-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta http-equiv="content-language" content="en-gb">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preload" href="{{ '/assets/fonts/Mona-Sans.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/style.css' | relative_url }}">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/custom.css' | relative_url }}">
    <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:description" content="{{ page.description | default: site.description }}" />
    <meta property="og:type" content="website" />
  </head>

  <body class="{% if page.layout == 'manual' %}manual{% endif %}">
    <header class="site-header">
      <nav class="site-nav d-flex flex-items-center flex-justify-between mx-auto px-3 px-md-6">
        <a href="#main" class="p-3 color-bg-accent-emphasis color-fg-on-emphasis show-on-focus">Skip to content</a>
        <a class="site-logo d-flex flex-items-center" href="{{ '/' | relative_url }}">
          <img
            src="{{ '/favicon.ico' | relative_url }}"
            width="24"
            height="24"
            class="mr-2"
            alt=""
            aria-hidden="true"
          >
          <span>Maton</span>
        </a>

        <div class="site-nav-links d-flex flex-items-center">
          <a href="https://github.com/maton-ai/cli" class="site-nav-link">GitHub</a>
          <a href="https://github.com/maton-ai/cli/releases/latest" class="site-nav-link">Release notes</a>
          <a href="https://maton.ai/login" class="site-nav-cta">Get started</a>
        </div>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer">
      <nav class="site-footer-nav d-flex flex-items-center flex-justify-between mx-auto px-3 px-md-6 f6 py-4">
        <ul class="list-style-none d-flex flex-items-center">
          <li class="mr-4 site-footer-copy">&copy; {{ 'now' | date: '%Y' }} Maton - All rights reserved.</li>
        </ul>
        <ul class="list-style-none d-flex flex-items-center site-footer-links">
          <li><a href="https://discord.com/invite/dBfFAcefs2" class="site-footer-link">Discord</a></li>
          <li><a href="https://x.com/maton_ai" class="site-footer-link">X</a></li>
          <li><a href="https://www.linkedin.com/company/maton-ai" class="site-footer-link">LinkedIn</a></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
